<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaVerse · 沉浸式多语言学习</title>
<meta name="description" content="LinguaVerse —— 英语、日语、韩语沉浸式在线学习平台：分级课程、单词记忆、语法练习、口语跟读、听力训练、进度追踪与社区成就。">
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1c2333; --muted:#6b7386; --line:#e6e9f2;
  --pri:#5b5ce2; --pri-d:#4647c9; --pri-soft:#eeeefe;
  --acc:#f59e0b; --ok:#10b981; --bad:#ef4444; --pink:#ec4899; --cyan:#06b6d4;
  --r:14px; --shadow:0 6px 24px rgba(28,35,51,.07);
  --grad:linear-gradient(135deg,#5b5ce2 0%,#8b5cf6 55%,#ec4899 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ===== 顶部导航 ===== */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:26px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.3px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:8px 13px;border-radius:9px;font-size:14.5px;color:var(--muted);font-weight:500;transition:.15s}
.nav-links a:hover{background:var(--pri-soft);color:var(--pri)}
.nav-links a.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.nav-user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri-d)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:#fff}.btn-ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn-lg{padding:12px 26px;font-size:15.5px;border-radius:12px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== Hero ===== */
.hero{background:var(--grad);color:#fff;padding:72px 0 88px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.09);top:-160px;right:-90px}
.hero::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-120px;left:-60px}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
.hero h1{font-size:42px;line-height:1.25;font-weight:800;margin-bottom:16px}
.hero p.sub{font-size:16.5px;opacity:.92;line-height:1.8;margin-bottom:28px}
.hero .tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:5px 13px;border-radius:99px;font-size:13px}
.hero-card{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:22px;backdrop-filter:blur(6px)}
.hero-card .row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px dashed rgba(255,255,255,.2)}
.hero-card .row:last-child{border:none}
.hero-card .row b{font-size:15px}
.hero-card .row span{font-size:13px;opacity:.85}

.section{padding:54px 0}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{font-size:27px;font-weight:800;margin-bottom:9px}
.sec-head p{color:var(--muted);font-size:14.5px}

.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card h3{font-size:16.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--muted);line-height:1.75}
.icon-bub{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}

/* 语言卡 */
.lang-card{cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.lang-card:hover{transform:translateY(-4px);border-color:var(--pri)}
.lang-card .flag{font-size:40px}
.lang-card .learners{font-size:12px;color:var(--muted);margin-top:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill-pri{background:var(--pri-soft);color:var(--pri)}
.pill-ok{background:#e7f8f1;color:#0b9e6f}
.pill-warn{background:#fef3e2;color:#c07a08}

/* 等级路径 */
.ladder{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.lv-row{display:flex;gap:16px;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.lv-row.locked{opacity:.62;background:#fafafc}
.lv-badge{min-width:64px;height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#fff}
.lv-info{flex:1}
.lv-info h4{font-size:16px;margin-bottom:5px}
.lv-info p{font-size:13px;color:var(--muted);line-height:1.6}
.lv-meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:14px}
.lv-act{display:flex;align-items:center}

/* Tabs */
.tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:12px;box-shadow:var(--shadow);flex-wrap:wrap}
.tabs button{flex:1;padding:10px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
.tabs button.done::after{content:" ✓";color:var(--ok)}
.tabs button.on.done::after{color:#d1fae5}

/* 学习区 */
.learn-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.flash-wrap{max-width:560px;margin:0 auto;text-align:center}
.flash{perspective:1200px;height:260px;margin:18px 0}
.flash-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .flash-in{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;box-shadow:var(--shadow)}
.flash-front{background:var(--panel);border:1px solid var(--line)}
.flash-back{background:var(--grad);color:#fff;transform:rotateY(180deg)}
.flash .word{font-size:34px;font-weight:800}
.flash .phon{color:var(--muted);font-size:15px}
.flash-back .m{font-size:26px;font-weight:700}
.flash-back .s{font-size:14px;opacity:.9}
.rate-row{display:flex;gap:12px;justify-content:center}
.rate{padding:11px 22px;border-radius:11px;font-weight:700;font-size:14px}
.rate-no{background:#fee2e2;color:#b91c1c}.rate-no:hover{background:#fecaca}
.rate-yes{background:#d1fae5;color:#047857}.rate-yes:hover{background:#a7f3d0}

.q-opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;font-size:14.5px;margin-bottom:10px;background:#fff;transition:.14s}
.q-opt:hover{border-color:var(--pri)}
.q-opt.right{border-color:var(--ok);background:#ecfdf5}
.q-opt.wrong{border-color:var(--bad);background:#fef2f2}
.tip-box{background:var(--pri-soft);border-radius:11px;padding:13px 16px;font-size:13.5px;color:var(--pri-d);line-height:1.7;margin-top:6px}

.speak-box{max-width:620px;margin:0 auto;text-align:center}
.speak-sent{font-size:26px;font-weight:700;margin:18px 0 6px;line-height:1.5}
.speak-hint{color:var(--muted);font-size:14px;margin-bottom:20px}
.mic-dot{width:78px;height:78px;border-radius:50%;background:var(--grad);color:#fff;font-size:30px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(91,92,226,.35);transition:.2s;margin:0 8px}
.mic-dot:hover{transform:scale(1.06)}
.mic-dot.rec{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(236,72,153,.45)}70%{box-shadow:0 0 0 22px rgba(236,72,153,0)}100%{box-shadow:0 0 0 0 rgba(236,72,153,0)}}

/* 进度 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .k{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:9px;background:#eef0f6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.prog-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.prog-row:last-child{border:none}
.prog-row .flag{font-size:24px}
.prog-row .info{flex:1}
.prog-row .info b{font-size:14.5px}
.chart{display:flex;align-items:flex-end;gap:12px;height:150px;padding:10px 6px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart .barv{width:100%;max-width:44px;background:var(--grad);border-radius:7px 7px 3px 3px;min-height:3px;transition:height .4s}
.chart .lb{font-size:11px;color:var(--muted)}
.chart .num{font-size:11px;font-weight:700;color:var(--pri)}

/* 社区 */
.post{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.post .head{display:flex;gap:11px;align-items:center;margin-bottom:10px}
.post .head .avatar{cursor:default}
.post .head b{font-size:14.5px}
.post .head time{font-size:12px;color:var(--muted);margin-left:auto}
.post .body{font-size:14px;line-height:1.8;color:#333c52}
.post .acts{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted)}
.post .acts button{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}
.post .acts button:hover,.post .acts button.liked{color:var(--pri)}
.post .cmt{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.post .cmt .c{font-size:13px;color:#414a60;padding:5px 0}
.post .cmt .c b{color:var(--ink)}
.cmt-row{display:flex;gap:8px;margin-top:10px}
.cmt-row input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;outline:none}
.cmt-row input:focus{border-color:var(--pri)}
textarea.ta{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;min-height:88px;resize:vertical;outline:none}
textarea.ta:focus{border-color:var(--pri)}

/* 成就 */
.ach{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.ach .medal{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;background:#f1f2f8;filter:grayscale(1);opacity:.55;flex:none}
.ach.got .medal{background:linear-gradient(135deg,#fde68a,#f59e0b);filter:none;opacity:1;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.ach .t b{font-size:14.5px;display:block}
.ach .t span{font-size:12.5px;color:var(--muted)}
.lb-row{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px dashed var(--line);font-size:14.5px}
.lb-row:last-child{border:none}
.lb-rank{width:30px;height:30px;border-radius:9px;background:#f1f2f8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted);flex:none}
.lb-row.me{background:var(--pri-soft);border-radius:10px;padding-left:10px;padding-right:10px}
.lb-row.me .lb-rank{background:var(--pri);color:#fff}

/* 表单 */
.auth-wrap{max-width:420px;margin:56px auto}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow)}
.auth-card h2{text-align:center;font-size:22px;margin-bottom:6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:24px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#3a4256}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;transition:.15s}
.fld input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,92,226,.12)}
.f-err{color:var(--bad);font-size:12.5px;margin-top:5px;min-height:16px}
.auth-alt{text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px}
.auth-alt a{color:var(--pri);font-weight:600}

/* Toast */
#toasts{position:fixed;top:74px;right:20px;z-index:99;display:flex;flex-direction:column;gap:10px}
.toast{background:#1c2333;color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.22);animation:tin .25s;max-width:320px}
.toast.ok{background:#0b9e6f}.toast.bad{background:#dc2626}.toast.gold{background:#b45309}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

.footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
.empty{text-align:center;padding:44px 0;color:var(--muted);font-size:14px}
.backlink{font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;margin-bottom:14px}
.backlink:hover{color:var(--pri)}
.sel{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none;font-size:14px}
.sel:focus{border-color:var(--pri)}
@media(max-width:900px){
  .hero-in{grid-template-columns:1fr}.g4,.g3{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:1fr 1fr}
  .nav-links{overflow-x:auto}.hero h1{font-size:31px}
}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}.nav-in{gap:12px}.nav-links a{padding:8px 8px;font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =========================================================
   LinguaVerse · 沉浸式多语言学习平台（单文件零依赖版）
   数据存储：localStorage（浏览器本地）
   ========================================================= */

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayKey = () => new Date().toISOString().slice(0, 10);
function hashPw(str){ let h = 5381; const s = "lv·" + str; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return "h" + h.toString(36); }
function toast(msg, type){ const t = document.createElement("div"); t.className = "toast " + (type || ""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => { t.style.opacity = "0"; t.style.transition = ".3s"; setTimeout(() => t.remove(), 320); }, 2600); }
function fmtDate(ts){ const d = new Date(ts); return `${d.getMonth() + 1}月${d.getDate()}日`; }
const XP = { word: 2, grammar: 10, listen: 10, speak: 6 };

/* ---------- 静态数据 ---------- */
const LANGS = {
  en: { name: "英语", flag: "🇬🇧", speech: "en-US", learners: "12.8 万人在学", color: "#5b5ce2" },
  ja: { name: "日语", flag: "🇯🇵", speech: "ja-JP", learners: "8.3 万人在学", color: "#ec4899" },
  ko: { name: "韩语", flag: "🇰🇷", speech: "ko-KR", learners: "5.6 万人在学", color: "#06b6d4" },
};
const LEVELS = [
  { id: "A1", name: "入门启航", desc: "零基础起步：问候、数字与最基础的高频表达", color: "#10b981" },
  { id: "A2", name: "基础进阶", desc: "应对旅行、点餐等日常场景的实用会话", color: "#06b6d4" },
  { id: "B1", name: "流利过渡", desc: "表达观点、描述经历，迈向独立交流", color: "#f59e0b" },
  { id: "B2", name: "熟练运用", desc: "讨论抽象话题，理解复杂文章（内容筹备中）", color: "#f97316", locked: true },
  { id: "C1", name: "精通之路", desc: "接近母语者的流畅与精准表达（内容筹备中）", color: "#ef4444", locked: true },
];

const COURSES = {
en: {
  A1: [
    { id: "en-a1-u1", title: "Greetings · 打招呼", vocab: [
      {t:"hello", p:"/həˈloʊ/", m:"你好"},{t:"morning", p:"/ˈmɔːrnɪŋ/", m:"早晨"},{t:"name", p:"/neɪm/", m:"名字"},
      {t:"nice", p:"/naɪs/", m:"愉快的"},{t:"meet", p:"/miːt/", m:"遇见"},{t:"goodbye", p:"/ˌɡʊdˈbaɪ/", m:"再见"},
      {t:"thank", p:"/θæŋk/", m:"感谢"},{t:"please", p:"/pliːz/", m:"请"}],
      grammar: [
        {q:"___ name is Li Ming.", o:["My","Me","I","Mine"], a:0, tip:"形容词性物主代词 my 后接名词：My name is… «我的名字是…»"},
        {q:"Nice ___ you!", o:["to meet","meet","meeting","met"], a:0, tip:"Nice to meet you! 是初次见面的固定问候语。"},
        {q:"— How are you? — I'm ___, thank you.", o:["fine","fun","five","find"], a:0, tip:"I'm fine, thank you. 是最标准的回答。"}],
      listen: [
        {t:"Good morning!", o:["Good morning!","Good night!","Goodbye!"], a:0},
        {t:"What is your name?", o:["What is your name?","Where is your home?","Who is your friend?"], a:0}],
      speak: [
        {t:"Hello, nice to meet you.", hint:"初次见面问候语，注意 nice 的 /aɪ/ 双元音"},
        {t:"Thank you very much.", hint:"thank 咬舌音 /θ/，very 上齿轻触下唇"}]},
    { id: "en-a1-u2", title: "Numbers & Daily · 数字与日常", vocab: [
      {t:"one", p:"/wʌn/", m:"一"},{t:"two", p:"/tuː/", m:"二"},{t:"time", p:"/taɪm/", m:"时间"},
      {t:"day", p:"/deɪ/", m:"天；白天"},{t:"week", p:"/wiːk/", m:"周"},{t:"eat", p:"/iːt/", m:"吃"},
      {t:"drink", p:"/drɪŋk/", m:"喝"},{t:"sleep", p:"/sliːp/", m:"睡觉"}],
      grammar: [
        {q:"I ___ up at seven every day.", o:["get","gets","getting","got"], a:0, tip:"主语 I 是第一人称，一般现在时动词用原形。"},
        {q:"She ___ breakfast at eight.", o:["has","have","having","haves"], a:0, tip:"第三人称单数 she 后动词要变形：have → has。"},
        {q:"It's nine ___ the morning.", o:["in","on","at","of"], a:0, tip:"in the morning/afternoon 是固定搭配，具体到某天某时刻才用 at/on。"}],
      listen: [
        {t:"I drink water every day.", o:["I drink water every day.","I drink milk every day.","I eat bread every day."], a:0},
        {t:"See you next week.", o:["See you next week.","See you tomorrow.","See you later."], a:0}],
      speak: [
        {t:"I get up at seven o'clock.", hint:"数字 seven 重读，o'clock 弱读"},
        {t:"What time is it now?", hint:"疑问词 what 要重读，句尾语调下降"}]},

/* ---------- 存储层 ---------- */
const DB_KEY = "linguaverse_db_v1";
function loadDB(){ try { return JSON.parse(localStorage.getItem(DB_KEY)) || { users: {}, session: null, posts: null }; } catch (e) { return { users: {}, session: null, posts: null }; } }
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

/* ---------- 云端同步层（P1） ---------- */
const API_BASE = "";
let CLOUD = { on: true, pending: false, syncing: false, lastErr: "" };
function cloudOnline(){ return CLOUD.on && (typeof navigator === "undefined" || navigator.onLine !== false); }
async function apiFetch(path, opts = {}) {
  if (typeof fetch !== "function") throw new Error("NETWORK");
  let r;
  try { r = await fetch(API_BASE + path, Object.assign({ credentials: "same-origin", headers: { "content-type": "application/json" } }, opts)); }
  catch (e) { throw new Error("NETWORK"); }
  if (!r.ok) { let e = null; try { e = await r.json(); } catch (_) {} throw new Error((e && e.error) || ("HTTP " + r.status)); }
  return r.json();
}
let _syncTimer = null;
function cloudScheduleSync() {
  if (!cloudOnline()) { CLOUD.pending = true; return; }
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => { const u = curUser(); if (u) cloudPushUser(u); }, 700);
}
async function cloudPushUser(u) {
  if (!cloudOnline()) { CLOUD.pending = true; return; }
  CLOUD.syncing = true;
  try {
    await apiFetch("/api/me", { method: "PUT", body: JSON.stringify({ xp: u.xp, days: u.days, streak: u.streak, bestStreak: u.bestStreak, ach: u.ach, enrolled: u.enrolled, progress: u.progress, moduleStat: u.moduleStat }) });
    CLOUD.pending = false; CLOUD.lastErr = "";
  } catch (e) { CLOUD.pending = true; CLOUD.lastErr = String((e && e.message) || e); }
  finally { CLOUD.syncing = false; }
}
async function cloudPullPosts() {
  try {
    const d = await apiFetch("/api/posts");
    if (Array.isArray(d.posts) && d.posts.length) { db.posts = d.posts; saveDB(db); if (location.hash.indexOf("/community") >= 0) route(); }
    return true;
  } catch (e) { return false; }
}
// 启动时探测后端：401/200 表示有后端；404/网络错误表示纯静态部署，降级本地
async function bootCloud() {
  try {
    const r = await fetch(API_BASE + "/api/me", { credentials: "same-origin" });
    if (r.status === 401 || r.status === 200) {
      CLOUD.on = true;
      if (r.status === 200) { const d = await r.json(); if (d.user) { db.users[d.user.name] = d.user; db.session = d.user.name; saveDB(db); } }
      return;
    }
    CLOUD.on = false;
  } catch (e) { CLOUD.on = false; }
}

function curUser(){ return db.session ? db.users[db.session] : null; }
function newUser(name, pw){
  db.users[name] = {
    name, pw: hashPw(pw), created: Date.now(), xp: 0,
    days: {}, streak: 0, bestStreak: 0, ach: [],

}
function saveUser(u){ db.users[u.name] = u; saveDB(db); if (CLOUD.on) cloudScheduleSync(); }

/* XP / 连续天数 / 成就 */
function gainXP(u, n){
  u.xp += n;
  const t = todayKey();
  u.days[t] = (u.days[t] || 0) + n;
  // 重算连续天数
  let s = 0; const d = new Date();
  for (;;) { const k = d.toISOString().slice(0, 10); if (u.days[k]) { s++; d.setDate(d.getDate() - 1); } else break; }
  u.streak = s; u.bestStreak = Math.max(u.bestStreak || 0, s);
  checkAch(u); saveUser(u);
}
function checkAch(u){
  const has = id => u.ach.includes(id);
  const add = id => { if (!has(id)) { u.ach.push(id); setTimeout(() => { toast(`🏅 成就解锁「${(ACH.find(a => a.id === id) || {}).name}」！`, "gold"); }, 400); } };
  if (u.created) add("first_login");
  if (u.xp >= 100) add("xp_100");
  if (u.xp >= 500) add("xp_500");
  if (u.streak >= 3) add("streak_3");
  if (u.streak >= 7) add("streak_7");
  if (Object.keys(u.enrolled || {}).length >= 2) add("polyglot");
  const units = countUnits(u); if (units >= 1) add("first_lesson");
}
function countUnits(u){
  let n = 0;
  for (const lang in (u.progress || {})) for (const lv in u.progress[lang]) n += Object.keys(u.progress[lang][lv]).length;
  return n;
}
/* 单元完成度：vocab/grammar/listen/speak 四项 */
function unitRec(u, unit){ return ((((u.progress || {})[unit.lang] || {})[unit.lv] || {})[unit.id]) || {}; }
function unitState(u, unit){
  const st = ((u.progress || {})[(unit.lang)] || {})[(unit.lv)] || {};
  const rec = st[unit.id] || {};
  return {
    vocab: (rec.vocab || []).length, grammar: (rec.grammar || []).length,
    listen: (rec.listen || []).length, speak: (rec.speak || []).length,
  };
}
function markDone(u, unit, mod, idx){
  const rec = (u.progress[unit.lang] = u.progress[unit.lang] || {});
  const lv = (rec[unit.lv] = rec[unit.lv] || {});
  const r = (lv[unit.id] = lv[unit.id] || {});
  r[mod] = r[mod] || [];
  if (!r[mod].includes(idx)) r[mod].push(idx);
}
function isUnitDone(u, unit){
  const s = unitState(u, unit);
  return s.vocab >= unit.vocab.length && s.grammar >= unit.grammar.length && s.listen >= unit.listen.length && s.speak >= unit.speak.length;
}
function allUnitsOf(lang){
  const arr = [];
  LEVELS.forEach(lv => (COURSES[lang][lv.id] || []).forEach(un => arr.push(Object.assign({ lang, lv: lv.id }, un))));
  return arr;
}
function levelDoneCount(u, lang, lvId){ return (COURSES[lang][lvId] || []).filter(un => isUnitDone(u, Object.assign({ lang, lv: lvId }, un))).length; }

window.startRec = function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;

  const rec = new SR(); rec.lang = LANGS[ui.lang].speech; rec.interimResults = false; rec.maxAlternatives = 3;
  btn.classList.add("rec"); $("#recResult").textContent = "🎙️ 正在聆听，请大声跟读…";
  rec.onresult = ev => {
    const said = Array.from(ev.results[0]).map(r => r.transcript);
    const target = unit.speak[ui.speakIdx].t.toLowerCase().replace(/[.,!?。、！？\s]/g, "");
    const hit = said.some(x => { const c = x.toLowerCase().replace(/[.,!?。、！？\s]/g, ""); return target.includes(c) || c.includes(target) || sim(target, c) > 0.6; });
    $("#recResult").innerHTML = hit
      ? `<span style="color:var(--ok);font-weight:700">🎉 识别到：「${esc(said[0])}」 — 发音很棒！</span>`
      : `<span style="color:var(--acc)">听到：「${esc(said[0])}」— 再对照示范练一遍试试？</span>`;

  rec.onerror = () => { $("#recResult").textContent = "⚠️ 没听清，请检查麦克风权限后重试"; btn.classList.remove("rec"); };
  rec.onend = () => { const b = $("#micBtn"); if (b) b.classList.remove("rec"); };

function sim(a, b){ // 粗略相似度（公共字符比例）
  if (!a || !b) return 0; const set = new Set(a.split("")); let hit = 0; b.split("").forEach(c => { if (set.has(c)) hit++; });
  return hit / Math.max(a.length, b.length);
}

function tts(text, lang, opt){

function last7vals(u){ const arr = []; for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); arr.push(u.days[d.toISOString().slice(0, 10)] || 0); } return arr; }

  for (const lang of Object.keys(u.enrolled)) {
    const next = allUnitsOf(lang).find(un => !isUnitDone(u, un));
    if (next) { items.push(`📖 ${LANGS[lang].name}${next.lv}《${esc(next.title)}》还未完成，按 单词 → 语法 → 听力 → 口语 的顺序走一遍即可点亮 ✓`); break; }
  }
  // 3) 升级提示
  for (const lang of Object.keys(u.enrolled)) {
    const lv = u.enrolled[lang]; const units = COURSES[lang][lv] || [];
    if (units.length && units.every(x => isUnitDone(u, Object.assign({ lang, lv }, x)))) {
      const nextLv = LEVELS[LEVELS.findIndex(l => l.id === lv) + 1];
      if (nextLv && !nextLv.locked && (COURSES[lang][nextLv.id] || []).length) items.push(`🎉 恭喜！${LANGS[lang].name} ${lv} 已全部完成，可以挑战 ${nextLv.id}《${nextLv.name}》了`);
      else items.push(`🎉 ${LANGS[lang].name} ${lv} 已全部完成！更高等级内容筹备中，先保持打卡节奏～`);
      break;
    }
  }
  // 4) 连续打卡提醒
  if (u.streak === 0) items.push(`🔥 今天还没学习哦，完成任意一个模块即可续上打卡！`);
  else if (u.streak === 1) items.push(`🔥 已连续学习 1 天，保持节奏，向「三日之约」成就进发！`);
  else if (u.streak >= 2) items.push(`🔥 已连续学习 ${u.streak} 天，再坚持 ${u.streak < 7 ? 7 - u.streak : 1} 天可解锁${u.streak < 7 ? "「七日坚守」" : "新的纪录"}成就！`);
  if (!items.length) items.push(`💪 先报名一门课程，个性化路径会随你的学习数据不断更新～`);
  return { html: items.map(t => `<div style="display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.7"><span>${t}</span></div>`).join("") };
}

/* ---------- 页面：社区 ---------- */
function viewCommunity(){
  const u = curUser();
  if (CLOUD.on && u) cloudPullPosts();
  const posts = getPosts();
  return `${navHTML("community")}
  <section class="section"><div class="wrap" style="max-width:760px">
    <div class="sec-head"><h2>学习社区</h2><p>和 26 万学习者交流心得 · 互相打气</p></div>
    ${u ? `<div class="card" style="margin-bottom:18px">
      <div style="display:flex;gap:10px;margin-bottom:10px"><b style="font-size:14px">✍️ 分享你的学习心得</b></div>
      <textarea class="ta" id="postBody" placeholder="今天学了什么？有什么好方法？都可以聊聊～"></textarea>
      <div style="text-align:right;margin-top:10px"><button class="btn btn-pri btn-sm" onclick="submitPost()">发布</button></div>
    </div>` : `<div class="card" style="margin-bottom:18px;text-align:center"><p>登录后即可发帖与互动～</p><a class="btn btn-pri btn-sm" style="margin-top:10px" href="#/login">去登录</a></div>`}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="tabs" style="box-shadow:none;padding:4px">
        <button class="${ui.commTab === 0 ? "on" : ""}" onclick="setCommTab(0)">🔥 最新讨论</button>
        <button class="${ui.commTab === 1 ? "on" : ""}" onclick="setCommTab(1)">🏆 XP 排行榜</button>
      </div>
    </div>
    ${ui.commTab === 0 ? posts.map(p => postHTML(p, u)).join("") : lbHTML(u)}
  </div></section>${footHTML()}`;
}
window.setCommTab = i => { ui.commTab = i; route(); };
function getPosts(){
  if (!db.posts) { db.posts = SEED_POSTS.slice(); saveDB(db); }
  return db.posts;
}
function postHTML(p, u){
  return `<div class="post">
    <div class="head"><div class="avatar" style="background:${p.avatarColor || "var(--pri)"}">${esc(p.user[0])}</div><b>${esc(p.user)}</b>${p.user === (u && u.name) ? '<span class="pill pill-pri">我</span>' : ""}<time>${fmtDate(p.time)}</time></div>
    <div class="body">${esc(p.body)}</div>
    <div class="acts">
      <button class="${p.liked ? "liked" : ""}" onclick="likePost('${p.id}')">${p.liked ? "❤️" : "🤍"} ${p.likes}</button>
      <button onclick="focusCmt('${p.id}')">💬 ${p.comments.length} 条评论</button>
    </div>
    ${p.comments.length ? `<div class="cmt">${p.comments.map(c => `<div class="c"><b>${esc(c.user)}：</b>${esc(c.text)}</div>`).join("")}</div>` : ""}
    ${u ? `<div class="cmt-row"><input id="cmt-${p.id}" placeholder="友善回复…" onkeydown="if(event.key==='Enter')submitCmt('${p.id}')"><button class="btn btn-ghost btn-sm" onclick="submitCmt('${p.id}')">回复</button></div>` : ""}
  </div>`;
}
window.likePost = async function(id){
  const u = curUser(); if (!u) { toast("登录后才能点赞哦", "bad"); return; }
  const p = getPosts().find(x => x.id === id); if (!p) return;
  p.liked = !p.liked; p.likes += p.liked ? 1 : -1; saveDB(db); route();
  if (CLOUD.on) { try { await apiFetch("/api/posts/" + encodeURIComponent(id), { method: "POST", body: JSON.stringify({ action: "like" }) }); } catch (e) { CLOUD.pending = true; } }
};
window.focusCmt = id => { const el = $("#cmt-" + id); if (el) el.focus(); };
window.submitCmt = async function(id){
  const u = curUser(); if (!u) { toast("登录后才能评论哦", "bad"); return; }
  const el = $("#cmt-" + id); const t = (el.value || "").trim();
  if (!t) return;
  const p = getPosts().find(x => x.id === id); if (!p) return;
  p.comments.push({ user: u.name, text: t }); saveDB(db); toast("评论成功", "ok"); route();
  if (CLOUD.on) { try { await apiFetch("/api/posts/" + encodeURIComponent(id), { method: "POST", body: JSON.stringify({ action: "comment", text: t }) }); } catch (e) { CLOUD.pending = true; } }
};
window.submitPost = async function(){
  const u = curUser(); if (!u) return;
  const body = ($("#postBody").value || "").trim();
  if (!body) { toast("写点什么再发布吧～", "bad"); return; }
  if (!u.ach.includes("social")) { u.ach.push("social"); checkAch(u); }
  const localId = "u" + Date.now();
  getPosts().unshift({ id: localId, user: u.name, avatarColor: "var(--pri)", time: Date.now(), body, likes: 0, liked: false, comments: [] });
  saveDB(db); gainXP(u, 10); $("#postBody").value = ""; toast("发布成功！+10 XP", "ok"); route();
  if (CLOUD.on) {
    try { const d = await apiFetch("/api/posts", { method: "POST", body: JSON.stringify({ body }) });
      const p = db.posts.find(x => x.id === localId); if (p && d.id) { p.id = d.id; saveDB(db); } }
    catch (e) { CLOUD.pending = true; }
  }
};
function lbHTML(u){
  const list = [...SEED_LB];
  if (u) list.push({ user: u.name, xp: u.xp, me: true });
  list.sort((a, b) => b.xp - a.xp);
  return `<div class="card">${list.map((r, i) => `
    <div class="lb-row ${r.me ? "me" : ""}">
      <div class="lb-rank" style="${i < 3 ? "background:linear-gradient(135deg,#fde68a,#f59e0b);color:#fff" : ""}">${i + 1}</div>
      <b style="flex:1">${esc(r.user)}${r.me ? "（我）" : ""}</b>
      <span style="color:var(--pri);font-weight:700">⚡ ${r.xp} XP</span>
    </div>`).join("")}</div>`;
}

/* ---------- 页面：成就 ---------- */
function viewAchievements(){
  const u = curUser();
  return `${navHTML("achievements")}
  <section class="section"><div class="wrap" style="max-width:860px">
    <div class="sec-head"><h2>成就中心</h2><p>${u ? `已点亮 ${u.ach.length} / ${ACH.length} 枚徽章，继续加油！` : "登录后开始收集你的徽章"}</p></div>
    <div class="grid g2">
      ${ACH.map(a => `<div class="ach ${u && u.ach.includes(a.id) ? "got" : ""}">
        <div class="medal">${a.icon}</div>
        <div class="t"><b>${a.name}</b><span>${a.desc}${u && u.ach.includes(a.id) ? " · ✅ 已达成" : ""}</span></div>
      </div>`).join("")}
    </div>
  </div></section>${footHTML()}`;
}

/* ---------- 页面：登录 / 注册 ---------- */
function viewLogin(){
  return `${navHTML("login")}
  <div class="auth-wrap"><div class="auth-card">
    <h2>欢迎回来 👋</h2><div class="sub">登录 LinguaVerse，继续你的语言之旅</div>
    <div class="fld"><label>用户名</label><input id="li-user" placeholder="请输入用户名" autocomplete="username"></div>
    <div class="fld"><label>密码</label><input id="li-pw" type="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="f-err" id="li-err"></div>
    <button class="btn btn-pri btn-lg" style="width:100%" onclick="doLogin()">登 录</button>
    <div class="auth-alt">还没有账号？<a href="#/register">免费注册</a></div>
  </div></div>${footHTML()}`;
}
function viewRegister(){
  return `${navHTML("register")}
  <div class="auth-wrap"><div class="auth-card">
    <h2>创建账号 🌱</h2><div class="sub">30 秒注册，立即开启沉浸式学习</div>
    <div class="fld"><label>用户名</label><input id="rg-user" placeholder="2-16 个字符" maxlength="16"></div>
    <div class="fld"><label>密码</label><input id="rg-pw" type="password" placeholder="至少 6 位" onkeydown="if(event.key==='Enter')doRegister()"></div>
    <div class="fld"><label>确认密码</label><input id="rg-pw2" type="password" placeholder="再输一遍" onkeydown="if(event.key==='Enter')doRegister()"></div>
    <div class="f-err" id="rg-err"></div>
    <button class="btn btn-pri btn-lg" style="width:100%" onclick="doRegister()">注册并开始学习</button>
    <div class="auth-alt">已有账号？<a href="#/login">直接登录</a></div>
  </div></div>${footHTML()}`;
}
window.doLogin = async function(){
  const n = $("#li-user").value.trim(), p = $("#li-pw").value;
  const err = $("#li-err");
  if (!n || !p) { if (err) err.textContent = "请输入用户名和密码"; return; }
  if (CLOUD.on) {
    try {
      const d = await apiFetch("/api/login", { method: "POST", body: JSON.stringify({ user: n, pw: p }) });
      db.users[d.user.name] = Object.assign({ pw: hashPw(p) }, d.user); db.session = d.user.name; saveDB(db);
      toast(`欢迎回来，${n}！`, "ok"); nav("/learn"); return;
    } catch (e) {
      if (e.message === "NETWORK" || e.message === "HTTP 404") {
        const u = db.users[n];
        if (u) { db.session = n; saveDB(db); toast(`🔌 离线模式：${n}，联网后进度自动同步`, "ok"); nav("/learn"); return; }
        if (err) err.textContent = "网络异常，请检查连接后重试"; return;
      }
      if (err) err.textContent = e.message; return; // 401 密码错等
    }
  }
  const u = db.users[n];
  if (!u || u.pw !== hashPw(p)) { if (err) err.textContent = "用户名或密码不正确"; return; }
  db.session = n; saveDB(db); toast(`欢迎回来，${n}！`, "ok"); nav("/learn");
};
window.doRegister = async function(){
  const n = $("#rg-user").value.trim(), p = $("#rg-pw").value, p2 = $("#rg-pw2").value;
  const err = $("#rg-err");
  if (n.length < 2) { err.textContent = "用户名至少 2 个字符"; return; }
  if (p.length < 6) { err.textContent = "密码至少 6 位"; return; }
  if (p !== p2) { err.textContent = "两次输入的密码不一致"; return; }
  if (CLOUD.on) {
    try {
      const d = await apiFetch("/api/register", { method: "POST", body: JSON.stringify({ user: n, pw: p }) });
      db.users[d.user.name] = Object.assign({ pw: hashPw(p) }, d.user); db.session = d.user.name; saveDB(db);
      toast(`🎉 欢迎加入 LinguaVerse，${n}！`, "ok"); nav("/courses"); return;
    } catch (e) {
      if (e.message === "NETWORK" || e.message === "HTTP 404") {
        // 无后端 / 离线：纯本地兜底注册
        const u = newUser(n, p); db.session = n; checkAch(u); saveDB(db);
        CLOUD.on = false;
        toast(`🎉 欢迎加入 LinguaVerse，${n}！（本地模式）`, "ok"); nav("/courses"); return;
      }
      err.textContent = e.message || "注册失败"; return; // 409 已注册等
    }
  }
  const u = newUser(n, p); db.session = n; checkAch(u); saveDB(db);
  toast(`🎉 欢迎加入 LinguaVerse，${n}！`, "ok"); nav("/courses");
};
window.logout = async function(){
  if (CLOUD.on) { try { await apiFetch("/api/logout", { method: "POST" }); } catch (e) {} }
  db.session = null; saveDB(db); toast("已退出登录", "ok"); nav("/home");
};

/* ---------- 渲染入口 ---------- */
function render(page){
  const views = {
    home: viewHome, courses: viewCourses, course: () => viewCourse(ui.lang || "en"),
    learn: viewLearn, progress: viewProgress, community: viewCommunity,
    achievements: viewAchievements, login: viewLogin, register: viewRegister,
  };
  app.innerHTML = (views[page] || viewHome)();
}
route();
bootCloud().finally(route);
</script>
